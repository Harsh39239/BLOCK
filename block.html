/* ---------- lock / unlock ---------- */
let tickId = null;
function startTick() {
  clearInterval(tickId);
  tickId = setInterval(() => { const el = $("#elapsed"); if (el && S.lock) el.textContent = hhmm(Date.now() - S.lock.start); }, 1000);
}
function lockNow(mode) {
  S.lock = { start: Date.now(), mode: mode || S.activeMode };
  const t = todayKey();
  if (!S.streakStart) S.streakStart = Date.now();
  else if (S.lastDay && S.lastDay !== t) {
    const gap = (new Date(t) - new Date(S.lastDay)) / DAY;
    if (gap > 1) {
      // streakDays() already reads 0 here, so record the streak as it stood on the last locked day
      const was = Math.floor((new Date(S.lastDay) - new Date(todayKey(new Date(S.streakStart)))) / DAY) + 1;
      S.longest = Math.max(S.longest, was); S.streakStart = Date.now();
    }
  }
  S.lastDay = t;
  addXP(10); checkBadges(); save();
}
function unlockNow(emergency) {
  if (!S.lock) return;
  const s = { start: S.lock.start, end: Date.now(), mode: S.lock.mode, apps: S.modes[S.lock.mode].apps.slice(), emergency: !!emergency };
  if (s.end - s.start > 30000) { S.sessions.push(s); addXP(Math.min(40, Math.round((s.end - s.start) / 600000) * 5)); }
  S.lock = null;
  if (emergency) { emergencyLeft(); S.emergency.used++; }
  checkBadges(); save();
}
function tapOverlay() {
  const on = !!S.lock;
  const demo = puckMethod(S.puck) === "demo";
  overlay(`<h2>${on ? "Tap to unlock" : "Tap to lock"}</h2>
    <p class="muted">${on ? "Walk to wherever you left the puck and tap your phone on it." : "Shuts " + nApps(blockedApps().length) + " in " + S.modes[S.activeMode].name + " mode. Then leave the puck in another room."}</p>
    <div style="margin:18px 0 6px">${puckBlock(on, demo ? "Demo puck · tap it on screen" : (S.puck ? esc(S.puck.name) : "Your puck"))}</div>
    ${readerPanel()}
    ${on ? `<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:12px" id="ov-emg">Emergency unlock instead (${emergencyLeft()} left)</button>` : ""}`);
  mountPuck(".ovbg #puck", { onTap: demoTap });
  listenForPuck({ pairing: false, onPuck: () => {
    ripple();
    setTimeout(() => {
      if (S.lock) { unlockNow(false); toast("Unlocked. " + hhmm(lockedMs(0)) + " locked today."); }
      else { lockNow(); toast(nApps(blockedApps().length) + " shut. Leave the puck somewhere else."); }
      closeOverlay(); render(); startTick();
    }, 420);
  } });
  const e = $("#ov-emg");
  if (e) e.onclick = () => {
    if (!emergencyLeft()) return toast("No emergency unlocks left this month.");
    unlockNow(true); closeOverlay(); render(); toast("Emergency unlock used. " + emergencyLeft() + " left.");
  };
}

/* ---------- scheduled locks ---------- */
// A rule locks once per window (e.g. 22:00 Mon -> 07:00 Tue) and ends on its
// own at the "to" time. Unlocking early with the puck is respected: the same
// window will not lock again.
const toMin = hm => { const p = String(hm || "").split(":").map(Number); return p[0] * 60 + (p[1] || 0); };
function activeWindow(now) {
  const mins = now.getHours() * 60 + now.getMinutes(), dow = (now.getDay() + 6) % 7;
  for (const r of S.schedule) {
    const f = toMin(r.from), t = toMin(r.to);
    if (isNaN(f) || isNaN(t) || f === t) continue;
    let startsYesterday = false;
    if (f < t) { if (mins < f || mins >= t) continue; }
    else if (mins >= f) { /* started today, runs past midnight */ }
    else if (mins < t) startsYesterday = true;
    else continue;
    const startDow = startsYesterday ? (dow + 6) % 7 : dow;
    if (!r.days.includes(startDow)) continue;
    const start = new Date(now); start.setHours(0, 0, 0, 0);
    if (startsYesterday) start.setDate(start.getDate() - 1);
    const startMs = start.getTime() + f * 60000;
    const len = (t > f ? t - f : 1440 - f + t) * 60000;
    return { rule: r, key: [todayKey(start), r.from, r.to, r.mode].join("|"), until: startMs + len };
  }
  return null;
}
function checkSchedule() {
  if (!S.user || !S.profile) return;
  const now = Date.now();
  let changed = false;
  if (S.lock && S.lock.until && now >= S.lock.until) {
    unlockNow(false); toast("Scheduled lock ended."); notify("Lock ended", "Your scheduled session is over. Apps are open again."); changed = true;
  }
  if (!S.lock) {
    const w = activeWindow(new Date(now));
    if (w && S.autoKey !== w.key) {
      S.autoKey = w.key;
      lockNow(w.rule.mode);
      S.lock.until = w.until; save();
      toast("Scheduled " + MODES[w.rule.mode].name + " lock started.");
      notify(MODES[w.rule.mode].name + " lock started", nApps(S.modes[w.rule.mode].apps.length) + " shut until " + w.rule.to + ". Tap your puck to end it early.");
      changed = true;
    }
  }
  if (changed && route().startsWith("app/") && !$("#ov")) { render(); if (S.lock) startTick(); }
}

/* ---------- overlay ---------- */
function overlay(html) {
  closeOverlay();
  const d = document.createElement("div");
  d.className = "ovbg"; d.id = "ov";
  d.innerHTML = `<div class="ov" role="dialog" aria-modal="true" style="position:relative"><button class="ovx" id="ov-x" aria-label="Close">&times;</button>${html}</div>`;
  document.body.append(d); document.body.style.overflow = "hidden";
  $("#ov-x").onclick = closeOverlay;
  d.onclick = e => { if (e.target === d) closeOverlay(); };
}
function closeOverlay() {
  disposeViewers();
  stopPuck();
  if (aiAbort) { try { aiAbort.abort(); } catch (e) {} aiAbort = null; }
  const o = $("#ov"); if (o) o.remove();
  document.body.style.overflow = "";
}

/* ---------- coach ---------- */
const COACH_RULES = `You are the BLOCK coach, inside BLOCK: an Android app paired with a physical NFC puck. The user taps their phone on the puck to lock their chosen apps; the app keeps those apps shut in the background; they tap the puck again to unlock. The puck has no battery and does not stay connected.
Style: warm, direct, practical, never preachy. Under 100 words. Plain text, no markdown or lists unless asked. At most one question per reply.
Help with: staying off the phone, setting up modes and schedules, what to do with an urge to unlock, making focus a habit, and how the product works.
Never: shame the user, claim to be a therapist, diagnose anything, or encourage more screen time. A broken streak is not a failure; say so plainly and move on.
If asked something you can't know (their exact settings, order status), say so and point them at the right screen.`;
function coachOffline(txt) {
  const l = txt.toLowerCase();
  if (/unlock|give up|let me/.test(l)) return "Before you walk over there: what were you about to open, and what were you hoping it would give you? If the answer is \u201cnothing, really\u201d, give it five more minutes and see.";
  if (/schedule|bedtime|exam/.test(l)) return "Go to Schedule and set one rule, not five. A 22:00 to 07:00 Sleep lock is the one most people keep. Add study hours once that's sticking.";
  if (/strict/.test(l)) return "Strict mode freezes your lists and makes uninstalling BLOCK much harder while a session is running. Turn it on once you trust the basics \u2014 it's the difference between a reminder and a lock.";
  if (/work|study|focus|concentrat/.test(l)) return "Lock before you start, not when you're already drifting. The tap is easiest to do while you still want to do it.";
  if (/streak|broke|missed/.test(l)) return "A missed day doesn't erase the ones before it. Your longest streak stays on record. Lock one short session today and the count starts again.";
  return "Tell me what's going on \u2014 an urge to unlock, a setup question, or a day that didn't go well. I'll help you think it through.";
}
function coachContext() {
  const p = [];
  p.push("Name: " + S.user.name);
  p.push("Active mode: " + S.modes[S.activeMode].name + " (" + blockedApps().join(", ") + ")");
  p.push("Currently " + (S.lock ? "LOCKED for " + hhmm(Date.now() - S.lock.start) : "unlocked"));
  p.push("Locked today: " + hhmm(lockedMs(0)) + "; streak " + streakDays() + " days");
  p.push("Schedules: " + (S.schedule.length ? S.schedule.map(r => r.from + "-" + r.to + " " + MODES[r.mode].name).join("; ") : "none"));
  p.push("Strict mode: " + (S.strict ? "on" : "off"));
  if (S.profile.goal) p.push("Their goal: " + S.profile.goal);
  return p.join("\n");
}
let aiAbort = null;
function coachOpen(first) {
  const live = !!CLOUD.sample;
  const msgs = [];
  overlay(`<div class="row" style="gap:11px"><span class="av">B</span><div><h2 style="font-size:23px">BLOCK coach</h2>
    <p class="muted" style="font-size:12px">${live ? "Powered by Claude" : "Offline answers"}</p></div></div>
    <div class="chat" id="chat"></div>
    <div class="row aibar"><input type="text" id="ai-in" placeholder="Type a message" aria-label="Message" autocomplete="off" enterkeyhint="send" style="font-size:16px"><button class="btn btn-lime btn-sm" id="ai-send" type="button">Send</button></div>`);
  const chat = $("#chat");
  const addRow = (mine, text) => {
    const r = document.createElement("div");
    r.className = "chatrow" + (mine ? " me" : "");
    r.innerHTML = `<span class="av">${mine ? esc(S.user.name[0].toUpperCase()) : "B"}</span><div class="msg${mine ? " me" : ""}"></div>`;
    r.lastChild.textContent = text;
    chat.append(r); r.scrollIntoView({ block: "end" });
    return r.lastChild;
  };
  addRow(false, S.lock ? "You're " + hhmm(Date.now() - S.lock.start) + " into a " + S.modes[S.lock.mode].name + " session. What's up?" : "Hi " + S.user.name + ". What's on your mind?");
  let busy = false;
  const send = async v => {
    v = v.trim(); if (!v || busy) return;
    addRow(true, v); $("#ai-in").value = "";
    if (!live) { setTimeout(() => addRow(false, coachOffline(v)), 350); return; }
    busy = true;
    const el = addRow(false, "\u2026");
    msgs.push({ role: "user", content: v });
    const input = [{ role: "user", content: COACH_RULES + "\n\nContext:\n" + coachContext() }, { role: "assistant", content: "Understood." }, ...msgs];
    aiAbort = new AbortController();
    try {
      const r = await CLOUD.sample(input, { onText: u => { el.textContent = u.text; }, signal: aiAbort.signal, cache: false });
      const t = (r.text || "").trim() || coachOffline(v);
      el.textContent = t; msgs.push({ role: "assistant", content: t });
    } catch (e) {
      if (e && e.code === "rate_limited") { el.textContent = "Give me a minute and try again."; msgs.pop(); }
      else { const t = coachOffline(v); el.textContent = t; msgs.push({ role: "assistant", content: t }); }
    }
    el.parentNode.scrollIntoView({ block: "end" });
    aiAbort = null; busy = false;
  };
  const inp = $("#ai-in");
  $("#ai-send").onclick = () => { send(inp.value); inp.focus(); };
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); send(inp.value); } };
  if (first) send(first);
  setTimeout(() => inp.focus(), 100);
}

/* ---------- sample data ---------- */
function toggleDemo() {
  if (S.demo) { S.sessions = S.sessions.filter(s => !s.demo); S.demo = false; S.streakStart = S.streakStart || 0; }
  else {
    const pat = [95, 140, 0, 180, 120, 60, 155];
    pat.forEach((mins, i) => {
      if (!mins) return;
      const d = new Date(); d.setHours(19, 0, 0, 0); d.setTime(d.getTime() - (6 - i) * DAY);
      const mode = MKEYS[i % 4];
      S.sessions.push({ start: d.getTime(), end: d.getTime() + mins * 60000, mode, apps: S.modes[mode].apps.slice(), demo: true });
    });
    S.demo = true; S.streakStart = S.streakStart || Date.now() - 6 * DAY; S.xp += 60;
  }
  save(); render();
}

/* ---------- bindings ---------- */
function bindApp(tab) {
  $("#t-tap").onclick = tapOverlay;
  if ($("#main #puck")) mountPuck("#main #puck", { onTap: tapOverlay });
  const ht = $("#h-tap"); if (ht) ht.onclick = tapOverlay;
  const he = $("#h-emg"); if (he) he.onclick = () => {
    if (!emergencyLeft()) return toast("No emergency unlocks left this month.");
    unlockNow(true); render(); toast("Emergency unlock used. " + emergencyLeft() + " left.");
  };
  const hc = $("#h-coach"); if (hc) hc.onclick = () => coachOpen();
  if (S.lock) startTick(); else clearInterval(tickId);

  $$("[data-setmode]").forEach(b => b.onclick = () => {
    if (S.lock && S.strict) return toast("Strict mode is on — finish the session first.");
    S.activeMode = b.dataset.setmode; save(); render();
  });
  $$(".chip[data-mode][data-app]").forEach(b => b.onclick = () => {
    if (S.lock && S.strict) return toast("Strict mode is on — lists are frozen until you unlock.");
    const m = S.modes[b.dataset.mode], a = b.dataset.app, i = m.apps.indexOf(a);
    if (i < 0) m.apps.push(a); else m.apps.splice(i, 1);
    b.setAttribute("aria-pressed", i < 0); save(); render();
  });

  const strict = $("#strict"); if (strict) strict.onclick = () => {
    if (S.lock && S.strict) return toast("You can't turn strict mode off mid-session. That's rather the point.");
    S.strict = !S.strict; save(); render(); toast("Strict mode " + (S.strict ? "on" : "off"));
  };

  $$("#s-mode .chip").forEach(b => b.onclick = () => $$("#s-mode .chip").forEach(x => x.setAttribute("aria-pressed", x === b)));
  $$("#s-days button").forEach(b => b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"));
  const sa = $("#s-add"); if (sa) sa.onclick = () => {
    const days = $$("#s-days button").filter(b => b.getAttribute("aria-pressed") === "true").map(b => +b.dataset.d);
    if (!days.length) return toast("Pick at least one day.");
    const mode = ($("#s-mode .chip[aria-pressed='true']") || {}).dataset.m || "sleep";
    S.schedule.push({ from: $("#s-from").value, to: $("#s-to").value, mode, days });
    addXP(15); save(); render(); toast("Rule added.");
    // first rule: offer notifications so a scheduled lock is noticeable (needs this click as the gesture)
    if (S.schedule.length === 1 && "Notification" in window && Notification.permission === "default") Promise.resolve(Notification.requestPermission()).catch(() => {});
  };
  $$("[data-delrule]").forEach(b => b.onclick = () => { S.schedule.splice(+b.dataset.delrule, 1); save(); render(); });

  const dm = $("#demo"); if (dm) dm.onclick = toggleDemo;
  const pr = $("#p-repair"); if (pr) pr.onclick = () => {
    // Pairing a new puck mid-session would be a way round the lock.
    if (S.lock) return toast("Unlock with your current puck first, then pair a new one.");
    overlay(`<h2>Pair a puck</h2><p class="muted">Tap your phone on the new puck. From then on it's the only one that works.</p>
      <div style="margin:18px 0 6px">${puckBlock(false, NFC.supported ? "Waiting for your puck…" : "Demo puck")}</div>
      ${readerPanel()}`);
    mountPuck(".ovbg #puck", { onTap: demoTap });
    listenForPuck({ pairing: true, onPuck: (id, method) => {
      ripple();
      setTimeout(() => {
        S.puck = { id: id, method: method, name: S.puck ? S.puck.name : "Desk puck", paired: Date.now() };
        save(); closeOverlay(); render(); toast(method === "demo" ? "Demo puck paired." : "New puck paired.");
      }, 420);
    } });
  };
  const nt = $("#p-notify"); if (nt) nt.onclick = async () => {
    if (!("Notification" in window)) return;
    if (Notification.permission === "denied") return toast("Notifications are blocked. Allow them for this site in your browser settings.");
    const r = await Notification.requestPermission();
    toast(r === "granted" ? "You'll get a notification when a scheduled lock starts or ends." : "Notifications stay off.");
    render();
  };
  const ib = $("#p-install"); if (ib) {
    if (installPrompt) ib.classList.remove("hide");
    ib.onclick = async () => { if (!installPrompt) return; installPrompt.prompt(); await installPrompt.userChoice.catch(() => {}); installPrompt = null; ib.classList.add("hide"); };
  }
  const gs = $("#p-goal-save"); if (gs) gs.onclick = () => { S.profile.goal = $("#p-goal").value.trim(); save(); toast("Saved."); };
  const ex = $("#p-export"); if (ex) ex.onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "block-data.json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const er = $("#p-erase"); if (er) er.onclick = () => {
    overlay(`<h2>Erase everything?</h2><p class="muted">Every session, schedule and badge goes. This can't be undone.</p>
      <div class="row" style="margin-top:22px"><button class="btn btn-ghost" style="flex:1" id="e-no">Keep it</button><button class="btn btn-lime" style="flex:1" id="e-yes">Erase</button></div>`);
    $("#e-no").onclick = closeOverlay;
    $("#e-yes").onclick = async () => {
      S = blank(); try { localStorage.removeItem(KEY); } catch (e) {}
      if (CLOUD.db && CLOUD.uid) { try { await CLOUD.db.doc("data/users/" + CLOUD.uid + "/state").delete(); } catch (e) {} }
      closeOverlay(); go("landing"); render();
    };
  };
}


/* ---------- the BLOCK device, as a real 3D object ---------- */
/* 48 x 48 x 12 mm. 1 unit = 10 mm. Built programmatically: no model file,
   no photograph, no background. The canvas is transparent throughout. */
const VIEWERS = [];
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const WAYS = [
  { id: "stone", name: "Warm Stone", hex: 0xD8D0C1, css: "#D8D0C1", lip: "#F6F1E6", cut: "#9A9183", rough: 0.78 },
  { id: "graphite", name: "Graphite", hex: 0x3C3F42, css: "#3C3F42", lip: "#6E7276", cut: "#232528", rough: 0.74 },
  { id: "moss", name: "Deep Moss", hex: 0x495540, css: "#495540", lip: "#79876C", cut: "#2B3326", rough: 0.76 },
];
function drawWord(g, S, size, track, fill, dx, dy) {
  const word = "BLOCK";
  g.font = "700 " + size + 'px "Bricolage Grotesque", "Arial Narrow", Helvetica, sans-serif';
  g.textBaseline = "middle";
  const w = word.split("").map(ch => g.measureText(ch).width);
  const total = w.reduce((a, x) => a + x, 0) + track * (word.length - 1);
  let x = (S - total) / 2 + dx;
  g.fillStyle = fill;
  word.split("").forEach((ch, i) => { g.fillText(ch, x, S / 2 + dy); x += w[i] + track; });
}
/* Engraving reads from three things at once: a shadow in the groove, a lit lip
   below it, and a real height map for the lighting to work with. */
function logoMaps(way) {
  const S = 1024, size = 128, track = 46;
  const col = document.createElement("canvas"); col.width = col.height = S;
  const a = col.getContext("2d");
  a.fillStyle = way.css; a.fillRect(0, 0, S, S);
  drawWord(a, S, size, track, way.lip, 0, 5);
  a.globalAlpha = 0.95; drawWord(a, S, size, track, way.cut, 0, 0); a.globalAlpha = 1;
  drawWord(a, S, size, track, way.cut, 0, -2);

  const hit = document.createElement("canvas"); hit.width = hit.height = S;
  const b = hit.getContext("2d");
  b.fillStyle = "#ffffff"; b.fillRect(0, 0, S, S);
  b.filter = "blur(2px)";
  drawWord(b, S, size, track, "#000000", 0, 0);

  const map = new THREE.CanvasTexture(col), bump = new THREE.CanvasTexture(hit);
  map.encoding = THREE.sRGBEncoding;
  map.anisotropy = bump.anisotropy = 8;
  return { map: map, bump: bump };
}

function puckShape(half, radius) {
  const s = new THREE.Shape(), w = half, r = radius;
  s.moveTo(-w + r, -w);
  s.lineTo(w - r, -w); s.quadraticCurveTo(w, -w, w, -w + r);
  s.lineTo(w, w - r);  s.quadraticCurveTo(w, w, w - r, w);
  s.lineTo(-w + r, w); s.quadraticCurveTo(-w, w, -w, w - r);
  s.lineTo(-w, -w + r); s.quadraticCurveTo(-w, -w, -w + r, -w);
  return s;
}

/* Matte plastic still reflects its room. Without an environment a
   MeshStandardMaterial reads as flat CG, so we bake a small light box. */
let ENV = null;
function studioEnv(renderer) {
  if (ENV) return ENV;
  const pm = new THREE.PMREMGenerator(renderer);
  const sc = new THREE.Scene();
  const panel = (w, h, x, y, z, rx, ry, c) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.rotation.set(rx, ry, 0); sc.add(m);
  };
  const room = new THREE.Mesh(new THREE.BoxGeometry(40, 40, 40),
    new THREE.MeshBasicMaterial({ color: 0x3a3d38, side: THREE.BackSide }));
  sc.add(room);
  panel(26, 26, 0, 16, 0, Math.PI / 2, 0, 0xffffff);         // overhead softbox
  panel(18, 14, -12, 4, 10, 0, Math.PI / 4, 0xf4f1ea);        // key, upper left front
  panel(14, 12, 13, 2, 6, 0, -Math.PI / 3.4, 0x9fb0c8);       // cool fill, right
  panel(16, 10, 0, 3, -15, 0, 0, 0xcfd6e0);                   // rim behind
  panel(26, 26, 0, -14, 0, -Math.PI / 2, 0, 0x1d1f1b);        // dark floor
  ENV = pm.fromScene(sc, 0.03).texture;
  pm.dispose();
  return ENV;
}

/* A faint grain so the finish is not mathematically perfect. */
let GRAIN = null;
function grainMap() {
  if (GRAIN) return GRAIN;
  const S = 512, c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d"), img = g.createImageData(S, S);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 150 + (Math.random() * 30 - 15);
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  GRAIN = new THREE.CanvasTexture(c);
  GRAIN.wrapS = GRAIN.wrapT = THREE.RepeatWrapping;
  GRAIN.repeat.set(5, 5);
  return GRAIN;
}

let GEO = null;
function puckGeometry() {
  if (GEO) return GEO;
  const bevel = 0.27;
  const body = new THREE.ExtrudeGeometry(puckShape(2.4, 1.15), {
    depth: 1.2 - bevel * 2, bevelEnabled: true, bevelThickness: bevel,
    bevelSize: bevel, bevelOffset: 0, bevelSegments: 11, curveSegments: 48, steps: 1,
  });
  body.rotateX(-Math.PI / 2); body.center();
  const pad = new THREE.ExtrudeGeometry(puckShape(2.26, 1.06), {
    depth: 0.1, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04,
    bevelSegments: 2, curveSegments: 24, steps: 1,
  });
  pad.rotateX(-Math.PI / 2); pad.center();
  GEO = { body: body, pad: pad, face: new THREE.PlaneGeometry(3.84, 3.84) };
  return GEO;
}
function buildPuck(shadows) {
  const g = puckGeometry(), grp = new THREE.Group();

  const bodyMats = WAYS.map(w => new THREE.MeshStandardMaterial({
    color: w.hex, roughness: w.rough - 0.12, metalness: 0,
    roughnessMap: grainMap(), bumpMap: grainMap(), bumpScale: 0.006, envMapIntensity: 1.05,
  }));
  const faceMats = WAYS.map(w => {
    const lm = logoMaps(w);
    return new THREE.MeshStandardMaterial({
      color: 0xffffff, map: lm.map, roughness: w.rough - 0.12, metalness: 0,
      roughnessMap: grainMap(), bumpMap: lm.bump, bumpScale: 0.22, envMapIntensity: 1.05,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
    });
  });

  const mBody = new THREE.Mesh(g.body, bodyMats[0]);
  mBody.castShadow = !!shadows; mBody.receiveShadow = !!shadows;
  grp.add(mBody);

  const mFace = new THREE.Mesh(g.face, faceMats[0]);
  mFace.rotation.x = -Math.PI / 2; mFace.position.y = 0.6005;
  grp.add(mFace);

  const mPad = new THREE.Mesh(g.pad, new THREE.MeshStandardMaterial({ color: 0x272723, roughness: 0.95, metalness: 0, roughnessMap: grainMap(), envMapIntensity: 0.5 }));
  mPad.position.y = -0.585; mPad.castShadow = !!shadows;
  grp.add(mPad);

  grp.userData.setWay = i => { mBody.material = bodyMats[i]; mFace.material = faceMats[i]; };
  return grp;
}
function mountPuck(sel, opts) {
  opts = opts || {};
  const host = typeof sel === "string" ? $(sel) : sel;
  if (!host || !window.THREE) return null;

  const W = () => host.clientWidth || 300, H = () => host.clientHeight || 300;
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2.5));
  renderer.setSize(W(), H(), false);
  renderer.setClearAlpha(0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.className = "pcanvas";
  host.append(renderer.domElement);

  const scene = new THREE.Scene();
  scene.environment = studioEnv(renderer);
  const cam = new THREE.PerspectiveCamera(30, W() / H(), 0.1, 120);
  cam.position.set(0, 0, 11.5);

  const pivot = new THREE.Group();
  const puck = buildPuck(true);
  pivot.add(puck);
  scene.add(pivot);

  // companions: the other finishes drifting behind, never in the way
  const extras = [];
  if (opts.extras) {
    [[-4.6, 2.6, -5, 1], [4.9, -2.4, -6, 2], [4.2, 3.1, -8, 0]].forEach(c => {
      const m = buildPuck(false);
      m.userData.setWay(c[3]);
      m.scale.setScalar(0.34);
      m.position.set(c[0], c[1], c[2]);
      m.rotation.set(0.5 + Math.random() * 0.4, Math.random() * 3, 0.2);
      scene.add(m); extras.push({ m: m, p: Math.random() * 6 });
    });
  }

  // studio light: one key, one fill, one rim, plus soft sky
  scene.add(new THREE.HemisphereLight(0xdfe4ee, 0x24241f, 0.10));
  const key = new THREE.DirectionalLight(0xfff6ea, 0.62);
  key.position.set(4.5, 7.5, 4.5); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 1; key.shadow.camera.far = 40;
  key.shadow.camera.left = -7; key.shadow.camera.right = 7;
  key.shadow.camera.top = 7; key.shadow.camera.bottom = -7;
  key.shadow.radius = 6; key.shadow.bias = -0.0012;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xcfd9f0, 0.14); fill.position.set(-6, 2, 3); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.22); rim.position.set(-2, 3, -8); scene.add(rim);
  

  // contact shadow, caught on nothing but alpha
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.3 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -2.1; floor.receiveShadow = true;
  scene.add(floor);

  // ambient occlusion by hand: a tight dark pool right under the object
  const ao = document.createElement("canvas"); ao.width = ao.height = 256;
  const ag = ao.getContext("2d"), rg = ag.createRadialGradient(128, 128, 6, 128, 128, 126);
  rg.addColorStop(0, "rgba(0,0,0,.62)"); rg.addColorStop(0.45, "rgba(0,0,0,.26)"); rg.addColorStop(1, "rgba(0,0,0,0)");
  ag.fillStyle = rg; ag.fillRect(0, 0, 256, 256);
  const contact = new THREE.Mesh(new THREE.PlaneGeometry(9, 9),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(ao), transparent: true, depthWrite: false }));
  contact.rotation.x = -Math.PI / 2; contact.position.y = -2.07;
  scene.add(contact);

  const REST = { x: 0.44, y: -0.40 };
  const st = { rx: REST.x - 0.55, ry: REST.y + 0.3, tx: REST.x, ty: REST.y, hx: 0, hy: 0, z: 13.5, tz: 11.5,
    drag: false, idle: 0, moved: 0, down: 0, px: 0, py: 0, vx: 0, vy: 0, lt: 0,
    t0: performance.now(), alive: true, pinch: 0 };

  const el = renderer.domElement;
  el.style.touchAction = "none";
  const pointers = new Map();

  el.addEventListener("pointerdown", e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    st.vx = st.vy = 0;
    if (pointers.size === 1) { st.drag = true; st.moved = 0; st.down = performance.now(); st.px = e.clientX; st.py = e.clientY; }
    if (pointers.size === 2) { const p = [...pointers.values()]; st.pinch = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); }
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2 && st.pinch) {
      const p = [...pointers.values()], d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      st.tz = Math.min(17, Math.max(6, st.tz * (st.pinch / d))); st.pinch = d; st.idle = 0; return;
    }
    if (st.drag) {
      const dx = e.clientX - st.px, dy = e.clientY - st.py;
      st.moved += Math.abs(dx) + Math.abs(dy);
      st.ty += dx * 0.0082; st.tx += dy * 0.0062;
      st.tx = Math.max(-1.56, Math.min(1.56, st.tx));
      st.vy = st.vy * 0.6 + dx * 0.0082 * 0.4;
      st.vx = st.vx * 0.6 + dy * 0.0062 * 0.4;
      st.px = e.clientX; st.py = e.clientY; st.idle = 0;
    } else if (!REDUCED) {
      const r = el.getBoundingClientRect();
      st.hy = ((e.clientX - r.left) / r.width - 0.5) * 0.3;
      st.hx = ((e.clientY - r.top) / r.height - 0.5) * 0.22;
    }
  });
  const up = e => {
    const quick = performance.now() - st.down < 420 && st.moved < 9;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) st.pinch = 0;
    if (st.drag && pointers.size === 0) {
      st.drag = false;
      if (quick) { st.vx = st.vy = 0; if (opts.onTap) opts.onTap(); }
    }
  };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("pointerleave", () => { st.hx = st.hy = 0; });
  el.addEventListener("wheel", e => {
    e.preventDefault();
    st.tz = Math.min(18, Math.max(6.2, st.tz + e.deltaY * 0.009)); st.idle = 0;
  }, { passive: false });

  let born = 0;
  const ease = (k, dt) => 1 - Math.pow(1 - k, Math.min(3, dt * 60));
  function frame(now) {
    if (!st.alive) return;
    requestAnimationFrame(frame);
    const t = (now - st.t0) / 1000;
    const dt = st.lt ? Math.min(0.05, (now - st.lt) / 1000) : 1 / 60;
    st.lt = now;
    born = Math.min(1, born + dt * 1.6);
    host.style.setProperty("--in", (born * born * (3 - 2 * born)).toFixed(3));

    // momentum: a flick keeps turning, then settles
    if (!st.drag && (Math.abs(st.vx) > 0.00008 || Math.abs(st.vy) > 0.00008)) {
      st.ty += st.vy; st.tx = Math.max(-1.56, Math.min(1.56, st.tx + st.vx));
      const decay = Math.pow(0.935, dt * 60);
      st.vx *= decay; st.vy *= decay;
      st.idle = 0;
    } else if (!st.drag) {
      st.idle += dt;
      if (st.idle > 2.2) {
        const k = ease(0.018, dt);
        st.tx += (REST.x - st.tx) * k; st.ty += (REST.y - st.ty) * k;
      }
    }
    const k = ease(0.14, dt);
    st.rx += (st.tx + st.hx - st.rx) * k;
    st.ry += (st.ty + st.hy - st.ry) * k;
    st.z += (st.tz - st.z) * ease(0.11, dt);

    extras.forEach((e, i) => {
      e.m.rotation.y += dt * (0.12 + i * 0.03);
      e.m.position.y += Math.sin(t * 0.5 + e.p) * dt * 0.22;
    });
    pivot.rotation.x = st.rx;
    pivot.rotation.y = st.ry;
    pivot.position.y = REDUCED ? 0 : Math.sin(t * 0.8) * 0.06;
    pivot.rotation.z = REDUCED ? 0 : Math.sin(t * 0.55) * 0.011;
    cam.position.z = st.z;

    // Resize only when the drawing buffer really differs from what setSize() would produce.
    const pr = renderer.getPixelRatio();
    if (host.clientWidth && (el.width !== Math.floor(W() * pr) || el.height !== Math.floor(H() * pr))) {
      renderer.setSize(W(), H(), false); cam.aspect = W() / H(); cam.updateProjectionMatrix();
    }
    renderer.render(scene, cam);
  }
  requestAnimationFrame(frame);

  const VIEWS = { angle: [REST.x, REST.y, 11.5], top: [1.52, 0, 10.4], base: [-1.52, 0, 10.4], edge: [0.06, -0.38, 9.6] };
  const v = {
    setView(n) { const a = VIEWS[n] || VIEWS.angle; st.tx = a[0]; st.ty = a[1]; st.tz = a[2]; st.vx = st.vy = 0; st.idle = -4; },
    reset() { v.setView("angle"); },
    dispose() {
      st.alive = false;
      try { renderer.dispose(); } catch (e) {}
      try { el.remove(); } catch (e) {}

  VIEWERS.push(v);
  el.addEventListener("dblclick", v.reset);
  return v;
}
function disposeViewers() { VIEWERS.slice().forEach(v => v.dispose()); }

/* ---------- go ---------- */
render();
initCloud();
if (S.lock) startTick();
checkSchedule();
setInterval(checkSchedule, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkSchedule(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#ov")) closeOverlay(); });
flushOutbox();
