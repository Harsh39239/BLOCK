<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLOCK — Tap to stop.</title>
<meta name="description" content="BLOCK is a physical off switch for distracting apps. Tap your phone on the puck to lock them; walk back and tap again to unlock.">
<meta name="theme-color" content="#121311">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121311;--surface:#1b1d19;--surface2:#242721;--line:#32352d;
  --text:#f2f0e8;--muted:#a3a699;--lime:#c6ff3d;--lime-soft:#c6ff3d;--lime-ink:#10140a;--warn:#ffb86b;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.04;margin:0;letter-spacing:-.025em;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:600;transition:transform .12s,background .15s,border-color .15s}
.btn:active{transform:scale(.975)}
.btn-lime{background:var(--lime);color:var(--lime-ink)}
.btn-lime:hover{background:#d6ff6e}
.btn-ghost{border:1px solid var(--line);background:transparent}
.btn-ghost:hover{border-color:#454a3e;background:var(--surface)}
.btn-sm{padding:9px 16px;font-size:14px;border-radius:999px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.card.tight{padding:16px}
.muted{color:var(--muted)}
.lime{color:var(--lime-soft)}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.hide{display:none!important}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.tag.on{border-color:var(--lime);color:var(--lime-soft)}

/* ---------- landing ---------- */
.nav{position:sticky;top:0;z-index:20;background:rgba(18,19,17,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font:700 21px var(--display);letter-spacing:.2em}
.nav-links{display:flex;gap:26px;font-size:14px;color:var(--muted)}
@media(max-width:780px){.nav-links{display:none}}
.hero{padding:56px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
@media(max-width:920px){.hero-grid{grid-template-columns:1fr;gap:40px}}
.hero h1{font-size:clamp(42px,7.4vw,82px)}
.hero p.sub{font-size:19px;color:var(--muted);max-width:480px;margin:22px 0 30px}
.section{padding:84px 0}
.section h2{font-size:clamp(28px,4.4vw,46px);max-width:720px}
.section .lead{color:var(--muted);font-size:17px;max-width:580px;margin-top:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:36px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:36px}
@media(max-width:840px){.grid3,.grid2{grid-template-columns:1fr}}
.steps{margin-top:36px;display:grid;gap:2px}
.step{display:grid;grid-template-columns:48px 1fr;gap:18px;padding:22px 0;border-top:1px solid var(--line);align-items:start}
.step b.n{font:700 30px var(--display);color:var(--lime);line-height:1}
.step h3{font-size:21px;margin-bottom:6px}
.price{font:700 46px var(--display)}
.price small{font:500 15px var(--body);color:var(--muted);display:block;margin-top:6px}
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--lime-soft);font-weight:400}
details[open] summary::after{content:"\2013"}
details p{color:var(--muted);margin-top:10px;max-width:660px}
footer{border-top:1px solid var(--line);padding:36px 0 60px;color:var(--muted);font-size:14px}

/* ---------- the puck ---------- */
.puckwrap{display:grid;place-items:center;gap:18px}
.puck{width:min(300px,78vw);aspect-ratio:1/1;position:relative;display:grid;place-items:center;border:0;background:none;padding:0}
.puck svg{width:100%;height:100%;overflow:visible}
.puck .halo{position:absolute;inset:16% 12% 10%;border-radius:34%;background:radial-gradient(closest-side,rgba(198,255,61,.40),transparent);opacity:.45;transition:opacity .4s;pointer-events:none}
.puck.on .halo{opacity:1}
.puck:active{transform:scale(.985)}
.wave{position:absolute;inset:20% 14% 14%;border-radius:30%;border:2px solid var(--lime);opacity:0;pointer-events:none}
@keyframes rip{0%{transform:scale(.6);opacity:.85}100%{transform:scale(1.9);opacity:0}}
.rip{animation:rip 1.1s ease-out forwards}
@media(prefers-reduced-motion:reduce){.rip{animation-duration:.01ms}}
.pucklabel{font:500 14px var(--body);color:var(--muted);text-align:center}

/* mock phone */
.phone{width:258px;margin:0 auto;border-radius:38px;border:7px solid #2a2c27;background:#121311;padding:16px 13px 20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.phone .pbar{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:12px}
.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.appicon{aspect-ratio:1/1;border-radius:13px;background:var(--surface2);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--muted);transition:background .3s,opacity .3s}
.appicon.shut{background:#151813;opacity:.4}
.appicon.shut::after{content:"";width:11px;height:14px;border:2px solid var(--lime);border-radius:3px;border-top-width:7px;border-top-color:transparent;box-shadow:inset 0 -3px 0 -1px var(--lime)}
.appicon.shut span{display:none}
.phonenote{margin-top:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:10px 12px;font-size:12px;color:var(--muted)}

/* ---------- onboarding ---------- */
.screen{min-height:100vh;display:flex;flex-direction:column}
.ob{max-width:540px;margin:0 auto;padding:26px 20px 44px;width:100%;flex:1}
.progress{height:3px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:14px 0 34px}
.progress b{display:block;height:100%;background:var(--lime);transition:width .35s}
.ob h2{font-size:clamp(27px,5.6vw,38px);margin-bottom:10px}
.q{margin-top:26px}
.q>label,.q>.ql{display:block;font-weight:600;margin-bottom:9px}
.why{font-size:13px;color:var(--muted);margin:-3px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);transition:.14s;font-size:15px}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--surface);margin-top:10px;transition:.14s}
.opt[aria-pressed="true"]{border-color:var(--lime);background:#232617}
.opt b{display:block;font-size:17px;font-family:var(--display)}
.opt span{color:var(--muted);font-size:14px}
input[type=text],input[type=email],input[type=number],input[type=time],textarea,select{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
textarea{min-height:88px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--lime)}
input[type=checkbox]{accent-color:var(--lime);width:17px;height:17px}
.ob-nav{display:flex;gap:12px;margin-top:34px}
.ob-nav .btn{flex:1}
.err{color:var(--warn);font-size:14px;margin-top:8px;min-height:1px}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:20px}

/* ---------- app shell ---------- */
.app{max-width:600px;margin:0 auto;padding:20px 18px 150px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.topbar h1{font-size:25px}
.pill{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--muted)}
.pill b{color:var(--lime-soft)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,19,17,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--lime-soft)}
.tab.act span.disc{width:58px;height:58px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin-top:-24px;box-shadow:0 0 28px rgba(198,255,61,.45)}
.tab.act span.disc svg{stroke:var(--lime-ink);width:25px;height:25px}
.tab.act em{font-style:normal;color:var(--lime-soft);font-weight:600}
.ring{position:relative;width:188px;height:188px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .n{font:700 48px/1 var(--display)}
.ring .u{font-size:13px;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;text-align:center}
.stats b{display:block;font:700 21px var(--display)}
.stats span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:7px;height:110px;margin-top:6px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--lime);min-height:3px}
.bars em{font-style:normal;font-size:11px;color:var(--muted)}
.list-item{padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.sw{width:46px;height:27px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;transition:.18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:.18s}
.sw[aria-pressed="true"]{background:var(--lime);border-color:var(--lime)}
.sw[aria-pressed="true"]::after{left:21px;background:var(--lime-ink)}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.weekgrid button{aspect-ratio:1/1.5;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted)}
.weekgrid button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);font-weight:600}
.empty{text-align:center;padding:26px 10px}
.empty b{display:block;font-family:var(--display);font-size:17px}
.empty p{color:var(--muted);font-size:14px;margin-top:6px}

/* ---------- overlay / chat ---------- */
.ovbg{position:fixed;inset:0;z-index:60;background:rgba(10,11,9,.78);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.ovbg{align-items:center}}
.ov{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:24px 20px calc(26px + env(safe-area-inset-bottom,0px))}
@media(min-width:620px){.ov{border-radius:22px}}
.ov h2{font-size:25px;margin-bottom:6px}
.ovx{position:absolute;top:14px;right:16px;color:var(--muted);font-size:26px;line-height:1}
.chat{height:46vh;min-height:230px;overflow:auto;margin:14px 0;display:flex;flex-direction:column;gap:12px;padding-right:2px}
.chatrow{display:flex;gap:9px;align-items:flex-end}
.chatrow.me{flex-direction:row-reverse}
.msg{background:var(--surface2);border-radius:14px 14px 14px 4px;padding:11px 14px;max-width:80%;font-size:15px;white-space:pre-wrap}
.msg.me{background:var(--lime);color:var(--lime-ink);border-radius:14px 14px 4px 14px}
.av{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;color:var(--lime-soft)}
.aibar input{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 17px;font-size:14px;z-index:90;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.timer{font:700 60px var(--display);text-align:center;margin:10px 0 2px}

/* ---------- the 3D viewer ---------- */
.stage{position:relative;width:100%;aspect-ratio:1/1;max-width:460px;margin:0 auto}
.stage .host{position:absolute;inset:0;opacity:var(--in,0);transition:opacity .25s}
.stage canvas.pcanvas{display:block;width:100%;height:100%;cursor:grab}
.stage canvas.pcanvas:active{cursor:grabbing}
.stage .wave{position:absolute;left:18%;right:18%;top:30%;height:40%;border-radius:26%;border:2px solid var(--lime);opacity:0;pointer-events:none}
.stage.on .glow{opacity:1}
.stage .glow{position:absolute;left:14%;right:14%;bottom:12%;height:30%;border-radius:50%;background:radial-gradient(closest-side,rgba(198,255,61,.42),transparent);opacity:0;transition:opacity .5s;pointer-events:none}
.pucklabel{font:500 14px var(--body);color:var(--muted);text-align:center;margin-top:14px}


/* ---------- try band ---------- */
.try{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;margin-top:40px}
@media(max-width:860px){.try{grid-template-columns:1fr;gap:40px;justify-items:center}}
.counter{font:800 clamp(34px,5vw,54px)/1 var(--display);color:var(--lime)}

/* ---------- film ---------- */
.film{display:block;position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(140deg,#1d201a,#121311 60%);padding:0;margin-top:36px}
.film .inner{display:grid;grid-template-columns:1fr;align-items:center;gap:30px;padding:34px}
@media(max-width:760px){.film .inner{grid-template-columns:1fr;padding:26px}}
.film h3{font-size:clamp(24px,3.4vw,36px)}
.film p{color:var(--muted);margin-top:10px;max-width:420px}
.film .play{display:inline-flex;align-items:center;gap:12px;margin-top:22px;font-weight:600}
.film .play i{width:52px;height:52px;border-radius:50%;background:var(--lime);display:grid;place-items:center;flex:none;transition:transform .2s}
.film:hover .play i{transform:scale(1.07)}
.film .play i svg{width:19px;height:19px;fill:var(--lime-ink);margin-left:3px}
.film .strip{display:flex;gap:8px}
.film .strip span{flex:1;height:96px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;padding:6px}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:36px}
@media(max-width:820px){.gal{grid-template-columns:1fr}}
.gal figure{margin:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff}
.gal img{width:100%;display:block}
.gal figcaption{background:var(--surface);color:var(--muted);font-size:13px;padding:12px 14px;border-top:1px solid var(--line)}


/* ================= premium storefront ================= */
.anno{background:var(--lime);color:var(--lime-ink);font-size:13px;font-weight:600;text-align:center;padding:9px 16px;position:relative;z-index:40}
.anno b{font-weight:700}
.nav{transition:padding .25s,background .25s}
.nav.shrunk .wrap{height:54px}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--lime);font-weight:600;margin-bottom:14px}
.hero h1{font-size:clamp(46px,8.6vw,96px);letter-spacing:-.035em}
.trust{display:flex;gap:26px;flex-wrap:wrap;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.trust div{font-size:13px;color:var(--muted);display:flex;gap:7px;align-items:center}
.trust svg{width:15px;height:15px;stroke:var(--lime);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.marquee{border-block:1px solid var(--line);overflow:hidden;padding:15px 0;background:var(--surface)}
.marquee ul{display:flex;gap:52px;margin:0;padding:0;list-style:none;width:max-content;animation:slide 34s linear infinite}
.marquee li{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.marquee li::before{content:"\2022";color:var(--lime);margin-right:52px}
@keyframes slide{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.marquee ul{animation:none}}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:38px}
@media(max-width:760px){.vs{grid-template-columns:1fr}}
.vs>div{border-radius:22px;padding:28px;border:1px solid var(--line)}
.vs .bad{background:var(--surface)}
.vs .good{background:linear-gradient(160deg,#1f2318,var(--surface));border-color:var(--lime)}
.vs h3{font-size:20px;margin-bottom:16px}
.vs li{list-style:none;padding:10px 0 10px 28px;position:relative;font-size:15px;color:var(--muted);border-bottom:1px solid var(--line)}
.vs li:last-child{border-bottom:0}
.vs ul{margin:0;padding:0}
.vs .bad li::before{content:"\00d7";position:absolute;left:4px;color:#7c8070;font-size:18px;line-height:1.4}
.vs .good li{color:var(--text)}
.vs .good li::before{content:"\2713";position:absolute;left:2px;color:var(--lime);font-weight:700}
.bignum{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:38px}
@media(max-width:760px){.bignum{grid-template-columns:1fr}}
.bignum div{border-top:2px solid var(--lime);padding-top:18px}
.bignum b{display:block;font:800 clamp(38px,5.4vw,60px)/1 var(--display);letter-spacing:-.04em}
.bignum span{display:block;color:var(--muted);font-size:14px;margin-top:10px;max-width:260px}
.bignum cite{display:block;font-size:11px;color:#6f7466;font-style:normal;margin-top:10px}
.flow{counter-reset:f;margin-top:40px;display:grid;gap:0}
.flow article{display:grid;grid-template-columns:72px 1fr;gap:22px;padding:30px 0;border-top:1px solid var(--line);align-items:start}
.flow article::before{counter-increment:f;content:"0" counter(f);font:800 24px var(--display);color:var(--lime)}
.flow h3{font-size:clamp(21px,2.6vw,28px);margin-bottom:8px}
.flow p{color:var(--muted);max-width:560px}
.box{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px}
@media(max-width:760px){.box{grid-template-columns:repeat(2,1fr)}}
.box div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;font-size:14px}
.box b{display:block;font-family:var(--display);font-size:16px;margin-bottom:4px}
.buycard{background:linear-gradient(165deg,#20241a,var(--surface));border:1px solid var(--lime);border-radius:26px;padding:30px}
.buycard .p{font:800 54px/1 var(--display);letter-spacing:-.04em}
.buycard .p small{display:block;font:500 14px var(--body);color:var(--muted);margin-top:10px}
.buycard ul{list-style:none;margin:22px 0 0;padding:0}
.buycard li{font-size:14px;color:var(--muted);padding:7px 0 7px 24px;position:relative}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<div id="root"></div>

<script>
/* ============================================================
   BLOCK — the companion app for the BLOCK puck.
   This build stores everything in the browser and, when the
   Claude runtime is present, syncs it to the signed-in account.
   The puck tap is simulated here; on Android it arrives as an
   NFC NDEF intent carrying the puck's UID.
   ============================================================ */
const KEY = "block.v1";
const DAY = 86400000;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

/* ---------- catalogue ---------- */
const APPS = ["Instagram", "YouTube", "Reddit", "X", "Snapchat", "TikTok", "Facebook", "LinkedIn", "Netflix", "Hotstar", "Chess", "Swiggy", "Zomato", "Amazon", "News", "Games"];
const ESSENTIAL = ["Phone", "Messages", "WhatsApp", "Maps", "UPI"];
const MODES = {
  study: { name: "Study", note: "Exams, assignments, deep reading", apps: ["Instagram", "YouTube", "Reddit", "X", "Snapchat", "TikTok", "Games", "Chess"] },
  work: { name: "Work", note: "Meetings, writing, focused blocks", apps: ["Instagram", "Reddit", "X", "Netflix", "Hotstar", "Games"] },
  sleep: { name: "Sleep", note: "Wind down and stay off the phone", apps: ["Instagram", "YouTube", "Reddit", "X", "Netflix", "Hotstar", "News", "Games"] },
  family: { name: "Family", note: "Dinner, evenings, time with people", apps: ["Instagram", "YouTube", "X", "LinkedIn", "News", "Games"] },
};
const MKEYS = ["study", "work", "sleep", "family"];
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const MILESTONES = [[1, "First lock"], [3, "Three days"], [7, "One week"], [14, "Two weeks"], [30, "One month"], [60, "Two months"], [100, "Hundred days"]];
const EMERGENCY_LIMIT = 5;

/* ---------- state ---------- */
function blank() {
  return {
    user: null, profile: null, puck: null,
    modes: JSON.parse(JSON.stringify(MODES)), activeMode: "study",
    lock: null, sessions: [], schedule: [], strict: false,
    emergency: { month: "", used: 0 }, streakStart: 0, longest: 0,
    xp: 0, claimed: [], plan: "free", demo: false,
  };
}
let S = load();
function load() { try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { return blank(); } }
function save(localOnly) {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (!localOnly && CLOUD.db && CLOUD.uid) queueCloud();
}

/* ---------- cloud sync ---------- */
const CLOUD = { db: null, user: null, sample: null, uid: null, status: "local" };
function syncLabel() { return { local: "Stored on this device only", syncing: "Syncing\u2026", synced: "Synced to your Claude account", error: "Sync error \u2014 will retry" }[CLOUD.status]; }
function setStatus(st) { CLOUD.status = st; const el = $("#sync"); if (el) el.textContent = syncLabel(); }
let cloudTimer = null, cloudBusy = false, cloudDirty = false;
function queueCloud() { cloudDirty = true; if (!cloudTimer) cloudTimer = setTimeout(flushCloud, 1200); }
async function flushCloud() {
  cloudTimer = null;
  if (cloudBusy) { cloudTimer = setTimeout(flushCloud, 1200); return; }
  if (!cloudDirty || !CLOUD.db || !CLOUD.uid) return;
  cloudDirty = false; cloudBusy = true; setStatus("syncing");
  try { await CLOUD.db.doc("data/users/" + CLOUD.uid + "/state").set({ v: S, updated: Date.now() }); setStatus("synced"); }
  catch (e) { cloudDirty = true; setStatus("error"); cloudTimer = setTimeout(flushCloud, 5000); }
  cloudBusy = false;
}
async function initCloud() {
  if (!(window.claude && claude.use)) return;
  try {
    const [db, user, sample] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("sample")]);
    CLOUD.sample = sample || null;
    if (db && user) {
      const uid = await user.id();
      if (uid) {
        CLOUD.db = db; CLOUD.user = user; CLOUD.uid = uid;
        let snap = null;
        try { snap = await db.doc("data/users/" + uid + "/state").get(); } catch (e) { setStatus("error"); render(); return; }
        const d = snap && snap.exists ? snap.data() : null;
        if (d && d.v && route() !== "onboarding") { S = Object.assign(blank(), d.v); save(true); setStatus("synced"); }
        else if (S.user || S.sessions.length) queueCloud();
        else setStatus("synced");
      }
    }
    render();
  } catch (e) { setStatus("error"); }
}

/* ---------- helpers ---------- */
const todayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const monthKey = () => todayKey().slice(0, 7);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = ts => new Date(ts).toLocaleDateString("en-IN", { day: "2-digit", month: "short" });
function hhmm(ms) {
  const m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60);
  return h ? h + "h " + String(m % 60).padStart(2, "0") + "m" : m + "m";
}
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; $("#toast-slot").append(t); setTimeout(() => t.remove(), 2400); }
function lockedMs(dayOffset) {
  const start = new Date(); start.setHours(0, 0, 0, 0); start.setTime(start.getTime() - (dayOffset || 0) * DAY);
  const end = start.getTime() + DAY;
  let total = S.sessions.reduce((a, s) => a + Math.max(0, Math.min(s.end, end) - Math.max(s.start, start.getTime())), 0);
  if (S.lock) total += Math.max(0, Math.min(Date.now(), end) - Math.max(S.lock.start, start.getTime()));
  return total;
}
function streakDays() {
  if (!S.streakStart) return 0;
  // The streak is broken once a whole calendar day passes without a lock.
  if (!S.lock && S.lastDay && (new Date(todayKey()) - new Date(S.lastDay)) / DAY > 1) return 0;
  return Math.floor((Date.now() - S.streakStart) / DAY) + 1;
}
const nApps = n => n + (n === 1 ? " app" : " apps");
function level() { return Math.floor(S.xp / 100) + 1; }
function addXP(n) { S.xp += n; }
function emergencyLeft() {
  if (S.emergency.month !== monthKey()) S.emergency = { month: monthKey(), used: 0 };
  return EMERGENCY_LIMIT - S.emergency.used;
}
function blockedApps() { return (S.modes[S.activeMode] || MODES.study).apps; }
function checkBadges() {
  const d = streakDays();
  MILESTONES.forEach(([n, label]) => {
    const id = "m" + n;
    if (d >= n && !S.claimed.includes(id)) { S.claimed.push(id); addXP(25); toast("Badge unlocked: " + label); }
  });
}

/* ---------- backend: pre-orders and early-access emails (Supabase) ----------
   The publishable key is safe in the browser: the database only lets it ADD
   rows to these two tables (row-level security + column grants). It cannot
   read, change or delete anything. Rows that fail to send (offline) wait in
   an outbox on this device and are retried when the connection returns. */
const SB = { url: "https://xlaqpjulqsuimywsrfpy.supabase.co", key: "sb_publishable_5sxcEcf2laZX_Gld1uS0lQ_pkANrGW6" };
const OUTBOX_KEY = "block.outbox";
async function sbInsert(table, row) {
  const r = await fetch(SB.url + "/rest/v1/" + table, {
    method: "POST",
    headers: { apikey: SB.key, "Content-Type": "application/json", Prefer: "return=minimal" },
    body: JSON.stringify(row),
  });
  if (r.ok || r.status === 409) return "saved";            // 409 = that email is already on the list
  if (r.status >= 400 && r.status < 500) return "invalid";  // the database rejected the values
  throw new Error("server " + r.status);
}
function readOutbox() { try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || "[]"); } catch (e) { return []; } }
function writeOutbox(list) { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch (e) {} }
async function submitRow(table, row) {
  try { return await sbInsert(table, row); }
  catch (e) { const l = readOutbox(); l.push({ table: table, row: row }); writeOutbox(l); return "queued"; }
}
let outboxBusy = false;
async function flushOutbox() {
  const list = readOutbox();
  if (outboxBusy || !list.length || navigator.onLine === false) return;
  outboxBusy = true;
  const keep = [];
  for (const it of list) { try { await sbInsert(it.table, it.row); } catch (e) { keep.push(it); } }
  writeOutbox(keep); outboxBusy = false;
}
addEventListener("online", flushOutbox);
const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

/* ---------- the real puck: NFC, QR code, or a demo puck ----------
   NFC uses Web NFC (Chrome on Android, HTTPS, page in the foreground, not
   inside an iframe). The tag's serial number identifies the puck. Phones
   without NFC can scan the QR code on the base instead (BarcodeDetector +
   camera). Anywhere else, a demo puck lets people try the app by clicking. */
const NFC = {
  supported: (() => { try { return "NDEFReader" in window && window.top === window; } catch (e) { return false; } })(),
  ctrl: null,
  async scan(onTag, onBadRead) {
    NFC.stop();
    const ctrl = new AbortController(); NFC.ctrl = ctrl;
    const reader = new NDEFReader();
    reader.onreading = e => {
      let id = (e.serialNumber || "").replace(/[^0-9a-f]/gi, "").toUpperCase();
      if (!id && e.message && e.message.records.length) {
        // no serial number exposed: fall back to the tag's first record
        try { id = "R" + new TextDecoder().decode(e.message.records[0].data).slice(0, 80); } catch (err) {}
      }
      onTag(id ? "NFC:" + id : "");
    };
    reader.onreadingerror = () => onBadRead && onBadRead();
    await reader.scan({ signal: ctrl.signal });
  },
  stop() { if (NFC.ctrl) { try { NFC.ctrl.abort(); } catch (e) {} NFC.ctrl = null; } },
};
const QR = {
  supported: "BarcodeDetector" in window && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
  stream: null, raf: 0,
  async scan(video, onCode) {
    QR.stop();
    const formats = BarcodeDetector.getSupportedFormats ? await BarcodeDetector.getSupportedFormats() : ["qr_code"];
    if (!formats.includes("qr_code")) throw Object.assign(new Error("no qr"), { name: "NotSupportedError" });
    const det = new BarcodeDetector({ formats: ["qr_code"] });
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    QR.stream = stream; video.srcObject = stream; await video.play();
    const tick = async () => {
      if (QR.stream !== stream) return;
      try { const codes = await det.detect(video); if (codes.length && codes[0].rawValue) return onCode("QR:" + codes[0].rawValue.slice(0, 200)); } catch (e) {}
      QR.raf = requestAnimationFrame(tick);
    };
    tick();
  },
  stop() {
    cancelAnimationFrame(QR.raf);
    if (QR.stream) { QR.stream.getTracks().forEach(t => t.stop()); QR.stream = null; }
    const v = $("#rvideo"); if (v) { v.srcObject = null; v.classList.add("hide"); }
  },
};
const puckMethod = p => (p && p.method) || "demo";   // pucks paired before this version were demos
function puckLabel(p) {
  if (!p) return "No puck paired";
  const m = puckMethod(p);
  if (m === "demo") return "Demo puck · no real tag";
  return (m === "qr" ? "QR code" : "NFC tag") + " · …" + String(p.id).slice(-6);
}
function readerPanel() {
  return `<div class="reader" aria-live="polite">
    <p class="rstat" id="rstat"></p>
    <video id="rvideo" class="rvideo hide" playsinline muted></video>
    <div class="ractions" id="ractions"></div>
  </div>`;
}
// One listener at a time. opts: { pairing: bool, onPuck(id, method) }
const PUCK = { opts: null };
function stopPuck() { NFC.stop(); QR.stop(); PUCK.opts = null; }
function puckStatus(msg, bad) { const el = $("#rstat"); if (el) { el.textContent = msg; el.classList.toggle("bad", !!bad); } }
function demoAllowed() { return PUCK.opts && (PUCK.opts.pairing ? !NFC.supported : puckMethod(S.puck) === "demo"); }
function puckFound(id, method) {
  const o = PUCK.opts; if (!o) return;
  if (!o.pairing && S.puck && S.puck.id && puckMethod(S.puck) !== "demo" && id !== S.puck.id)
    return puckStatus("That's a different puck. Use the one you paired, or pair this one in Profile.", true);
  stopPuck();
  if (navigator.vibrate) navigator.vibrate(40);
  o.onPuck(id, method);
}
function demoTap() {
  if (!PUCK.opts) return;
  if (demoAllowed()) return puckFound(null, "demo");
  puckStatus("This puck is real, so the one on screen won't work. Tap your phone on the actual puck.", true);
}
function listenForPuck(opts) {
  stopPuck();
  PUCK.opts = opts;
  const acts = $("#ractions"); if (!acts) return;
  const btns = [];
  const startNfc = () => {
    puckStatus("Hold the back of your phone flat on the puck.");
    NFC.scan(id => {
      if (!id) return puckStatus("That tag has no ID we can read. Try again, or use the QR code.", true);
      puckFound(id, "nfc");
    }, () => puckStatus("Couldn't read that. Hold the phone still on the puck for a second.", true)).catch(err => {
      if (err && err.name === "NotAllowedError") puckStatus("NFC permission is blocked. Allow it for this site in Chrome's settings, then press Start NFC.", true);
      else if (err && err.name === "NotReadableError") puckStatus("NFC is turned off. Switch it on in your phone's settings, then press Start NFC.", true);
      else puckStatus("NFC didn't start. Press Start NFC to try again.", true);
      const b = $("#r-nfc"); if (b) b.classList.remove("hide");
    });
  };
  if (NFC.supported) btns.push(`<button class="btn btn-ghost btn-sm hide" id="r-nfc" type="button">Start NFC</button>`);
  if (QR.supported) btns.push(`<button class="btn btn-ghost btn-sm" id="r-qr" type="button">Scan the QR code instead</button>`);
  if (opts.pairing && NFC.supported) btns.push(`<button class="btn btn-ghost btn-sm" id="r-demo" type="button">No puck yet? Use a demo puck</button>`);
  acts.innerHTML = btns.join("");
  const nb = $("#r-nfc"); if (nb) nb.onclick = startNfc;
  const db = $("#r-demo"); if (db) db.onclick = () => puckFound(null, "demo");
  const qb = $("#r-qr"); if (qb) qb.onclick = () => {
    NFC.stop();
    const v = $("#rvideo"); v.classList.remove("hide");
    puckStatus("Point the camera at the QR code on the base of the puck.");
    QR.scan(v, id => puckFound(id, "qr")).catch(err => {
      QR.stop();
      puckStatus(err && err.name === "NotAllowedError" ? "Camera permission is blocked. Allow it for this site to scan the code." : "This browser can't scan QR codes.", true);
    });
  };
  if (NFC.supported) startNfc();
  else if (opts.pairing) puckStatus(QR.supported ? "Scan the QR code, or tap the puck on screen for a demo." : "Tap the puck on screen to pair a demo puck.");
  else if (puckMethod(S.puck) === "demo") puckStatus("Demo puck: tap it on screen.");
  else puckStatus("This device can't read NFC." + (QR.supported ? " Scan the QR code on the puck instead." : " Open BLOCK on the phone you paired."), !QR.supported);
}

let installPrompt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; const b = $("#p-install"); if (b) b.classList.remove("hide"); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
function notify(title, body) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const opts = { body: body, icon: "icon-192.png", badge: "icon-192.png", tag: "block-lock" };
  if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(title, opts)).catch(() => {});
  else try { new Notification(title, opts); } catch (e) {}
}

/* ---------- puck drawing ---------- */
function puckBlock(on, label) {
  return `<div class="puckwrap">
    <div class="stage${on ? " on" : ""}" id="puckstage">
      <span class="glow"></span>
      <div class="host" id="puck"></div>

    <p class="pucklabel">${label}</p>
  </div>`;
}
function ripple() {
  ["#w1", "#w2"].forEach((id, i) => {
    const el = $(id); if (!el) return;
    el.classList.remove("rip"); void el.offsetWidth;
    setTimeout(() => el.classList.add("rip"), i * 170);
  });
}

/* ---------- routing ---------- */
const route = () => location.hash.replace("#", "") || "landing";
function go(r) { location.hash = r; }
window.addEventListener("hashchange", render);
const isRoute = id => id === "landing" || id === "auth" || id === "onboarding" || id.startsWith("app/");

// In-page links (#why, #how, #film, #kit, #buy) scroll to their section
// instead of changing the hash, which the router would treat as a page.
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  const id = a.getAttribute("href").slice(1);
  if (!id || isRoute(id)) return;
  const target = document.getElementById(id);
  if (!target) return;
  e.preventDefault();
  target.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" });
});

// Things the landing page starts that must stop when another view renders.
const LANDING = { onScroll: null, promoTimer: null };
function teardownLanding() {
  if (LANDING.onScroll) { removeEventListener("scroll", LANDING.onScroll); LANDING.onScroll = null; }
  clearInterval(LANDING.promoTimer); LANDING.promoTimer = null;
}

function render() {
  disposeViewers();
  teardownLanding();
  stopPuck();
  const r = route();
  const root = $("#root");
  if (r === "landing") { root.innerHTML = landing(); bindLanding(); }
  else if (r === "auth") { root.innerHTML = authView(); bindAuth(); }
  else if (r === "onboarding") { renderOB(); }
  else if (r.startsWith("app/")) {
    if (!S.user) return go("auth");
    if (!S.profile) return go("onboarding");
    root.innerHTML = appView(r.slice(4));
    bindApp(r.slice(4));
  } else go("landing");
  window.scrollTo(0, 0);
}

  <section class="section reveal" id="why"><div class="wrap">
    <p class="eyebrow">Why screen time settings fail</p>
    <h2>The unlock is on the same phone as the temptation.</h2>
    <p class="lead">One tap on "ignore" and you're back. BLOCK moves the key off the phone and puts it across the room, where getting it takes a decision instead of a reflex.</p>
    <div class="vs">
      <div class="bad"><h3>Built-in limits</h3><ul>
        <li>Dismissed with one tap</li>
        <li>You set it and you break it, in the same second</li>
        <li>Nothing physical stands in the way</li>
        <li>Easy to delete when it gets inconvenient</li>
      </ul></div>
      <div class="good"><h3>BLOCK</h3><ul>
        <li>The key is a separate object</li>
        <li>Unlocking means standing up and walking</li>
        <li>Strict mode closes the back doors</li>
        <li>Five emergency unlocks a month for the real ones</li>
      </ul></div>
    </div>
  </div></section>

  <section class="section reveal" style="background:var(--surface)"><div class="wrap">
    <p class="eyebrow">Why now</p>
    <h2>You are not imagining it.</h2>
    <div class="bignum">
      <div><b>3\u20136 hrs</b><span>online every day, the most common pattern among Indians aged 11\u201330</span><cite>YLAC SCREEN survey of 3,907 young people, Dec 2025</cite></div>
      <div><b>500 mn+</b><span>social media user identities in India</span><cite>DataReportal, Digital 2026: India</cite></div>
      <div><b>2025\u201326</b><span>the year India's Economic Survey flagged digital addiction among young people as a growing concern</span><cite>Economic Survey 2025\u201326, Ministry of Finance</cite></div>
    </div>
  </div></section>

  <section class="section reveal" id="how"><div class="wrap">
    <p class="eyebrow">How it works</p>
    <h2>Two taps. That is the entire product.</h2>
    <div class="try" style="margin-top:36px">

function bindLanding() {
  const start = () => go(S.user ? (S.profile ? "app/home" : "onboarding") : "auth");
  ["#l-start", "#l-try", "#f-app"].forEach(id => { const el = $(id); if (el) el.onclick = e => { e.preventDefault(); start(); }; });
  // "Pre-order" buttons in the hero and sticky bar take you to the price card;
  // the price card's own button opens the reservation form.
  ["#l-start2", "#l-buy2"].forEach(id => { const el = $(id); if (el) el.onclick = e => {
    e.preventDefault(); $("#buy").scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" });
  }; });
  const buyBtn = $("#l-buy"); if (buyBtn) buyBtn.onclick = e => { e.preventDefault(); reserve(); };

  let on = false, viewer = null;
  const setLock = v => {
    on = v; ripple();
    const card = $("#shotcard"), stage = $("#puckstage");
    if (card) card.classList.toggle("on", on);
    if (stage) stage.classList.toggle("on", on);
    const ss = $("#shot-state"); if (ss) ss.textContent = on ? "4 apps locked" : "Apps open";
    $("#l-state").textContent = on ? "4 apps locked" : "Apps open";
    $("#l-note").textContent = on ? "Locked. The puck can go in another room now \u2014 the lock holds." : "The four on the top row are the ones you picked. Click the puck above.";
    $$("#l-apps .appicon").forEach(el => el.classList.toggle("shut", on && el.dataset.k === "block"));
    const pl = $(".pucklabel"); if (pl) pl.textContent = on ? "Click again to unlock" : "Drag to turn it \u00b7 click to lock";
  };
  const card = $("#shotcard");
  if (card) card.onclick = () => setLock(!on);

  // the photograph leads; 3D is there for anyone who wants to inspect it
  const photoBtn = $("#v-photo"), tdBtn = $("#v-3d"), live = $("#live3d");
  const setView = td => {
    photoBtn.setAttribute("aria-pressed", !td);
    tdBtn.setAttribute("aria-pressed", td);
    card.classList.toggle("hide", td);
    live.classList.toggle("hide", !td);
    if (td && !viewer) viewer = mountPuck("#puck", { extras: true, onTap: () => setLock(!on) });
    if (!td && viewer) { viewer.dispose(); viewer = null; live.innerHTML = PUCKHTML; }
  };
  const PUCKHTML = live.innerHTML;
  photoBtn.onclick = () => setView(false);
  tdBtn.onclick = () => setView(true);

  const L = { way: 0, tier: 0 };

  // quantity tiers
  function priceOut() {
    const t = TIERS[L.tier], total = Math.round(3499 * t[1] * (1 - t[3]));
    const money = "\u20b9" + total.toLocaleString("en-IN");
    const el = $("#bc-price");
    if (el) el.firstChild.textContent = money;
    const sub = $("#bc-sub");
    if (sub) sub.textContent = (t[1] > 1 ? t[1] + " pucks" : "One puck") + " \u00b7 free delivery across India";
    const bb = $("#bb-label");
    if (bb) bb.textContent = "BLOCK \u00d7 " + t[1] + " \u2014 " + money;
  }
  function reserve() {
    const t = TIERS[L.tier], total = "₹" + Math.round(3499 * t[1] * (1 - t[3])).toLocaleString("en-IN");
    overlay(`<h2>Reserve ${t[1] > 1 ? t[1] + " pucks" : "your puck"}</h2>
      <p class="muted">${esc(t[0])} · ${total} · free delivery across India</p>
      <form id="r-form" novalidate>
        <div class="q"><label for="r-name">Name</label><input id="r-name" name="name" type="text" autocomplete="name" maxlength="100" required></div>
        <div class="q"><label for="r-mail">Email</label><input id="r-mail" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required></div>
        <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="err" id="r-err" role="alert"></p>
        <button class="btn btn-lime" style="width:100%;margin-top:18px" id="r-go" type="submit">Reserve — pay when it ships</button>
      </form>
      <p class="note">Nothing is charged today. We'll email you when your batch is ready to ship, and you pay then. Thirty days to send it back after it arrives.</p>`);
    $("#r-form").onsubmit = async e => {
      e.preventDefault();
      const f = e.target, name = $("#r-name").value.trim(), mail = $("#r-mail").value.trim(), err = $("#r-err"), btn = $("#r-go");
      if (!name) { err.textContent = "Add your name so we know who it's for."; return $("#r-name").focus(); }
      if (!EMAIL_RE.test(mail)) { err.textContent = "That email doesn't look right."; return $("#r-mail").focus(); }
      err.textContent = "";
      let res = "saved";
      if (!f.elements.company.value) {   // honeypot: skip saving if a bot filled the hidden field
        btn.disabled = true; btn.textContent = "Saving…";
        res = await submitRow("preorders", { name: name, email: mail, quantity: t[1], source: "web" });
        btn.disabled = false; btn.textContent = "Reserve — pay when it ships";
      }
      if (res === "invalid") { err.textContent = "That didn't go through. Check your name and email and try again."; return; }
      const ov = $(".ov"); if (!ov) return;
      ov.innerHTML = `<button class="ovx" id="ov-x" aria-label="Close">&times;</button>
        <h2>You're on the list.</h2>
        <p class="muted" style="margin-top:8px">${esc(t[0])} for ${total}. We'll write to ${esc(mail)} before anything is charged.</p>
        ${res === "queued" ? `<p class="note">You're offline right now. Your reservation is saved on this device and will be sent as soon as you're back online.</p>` : ""}
        <button class="btn btn-lime" style="width:100%;margin-top:22px" id="r-done">Done</button>`;
      $("#ov-x").onclick = closeOverlay; $("#r-done").onclick = closeOverlay;
    };
    setTimeout(() => { const n = $("#r-name"); if (n) n.focus(); }, 50);
  }
  $$("#tiers .tier").forEach(b => b.onclick = () => {
    L.tier = +b.dataset.tier;
    $$("#tiers .tier").forEach(x => x.setAttribute("aria-pressed", x === b));
    priceOut();
  });
  priceOut();

  // early-access side tab (desktop) and footer form (every size) both post to Supabase
  const tab = $("#tab");
  if (tab) {
    $("#tabgrip").onclick = () => tab.classList.toggle("open");
    $("#tabgrip").setAttribute("role", "button"); $("#tabgrip").tabIndex = 0;
    $("#tabgrip").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tab.classList.toggle("open"); } };
  }
  $$("form[data-ea]").forEach(f => f.onsubmit = async e => {
    e.preventDefault();
    const input = f.elements.email, msg = $(".eamsg", f), btn = $("button[type=submit]", f);
    const v = input.value.trim();
    msg.classList.remove("bad");
    if (!EMAIL_RE.test(v)) { msg.classList.add("bad"); msg.textContent = "That email doesn't look right."; input.focus(); return; }
    if (f.elements.company.value) { msg.textContent = "Noted. We'll be in touch."; return; }   // honeypot: a bot filled the hidden field
    btn.disabled = true; msg.textContent = "Saving…";
    const res = await submitRow("signups", { email: v, source: f.closest("#tab") ? "web-tab" : "web-footer" });
    btn.disabled = false;
    if (res === "invalid") { msg.classList.add("bad"); msg.textContent = "That email didn't go through. Check it and try again."; return; }
    msg.textContent = res === "queued" ? "You're offline. We'll send it as soon as you're back." : "You're on the list. We'll email you when the next batch opens.";
    input.value = "";
  });

  // sections ease in as they arrive
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "-10% 0px -8%" });
    $$(".reveal").forEach(el => io.observe(el));
  } else $$(".reveal").forEach(el => el.classList.add("in"));

  // nav tightens, buy bar rises once the hero is behind you
  const nav = $("#nav"), bar = $("#buybar"), buy = $("#buy");
  const onScroll = () => {
    const y = scrollY;
    if (nav) nav.classList.toggle("shrunk", y > 60);
    if (bar && buy) {
      const r = buy.getBoundingClientRect();
      bar.classList.toggle("up", y > 520 && r.top > innerHeight * 0.4);
    }
  };
  LANDING.onScroll = onScroll;
  addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  // promo carousel: autoplay (unless reduced motion), prev / pause / next, dots
  const slides = $$("#slides .slide"), dots = $$("#pdots i"), playBtn = $("#p-play");
  let cur = 0, playing = !REDUCED;
  const show = i => {
    cur = (i + slides.length) % slides.length;
    slides.forEach((s, k) => { s.classList.toggle("on", k === cur); s.setAttribute("aria-hidden", k !== cur); });
    dots.forEach((d, k) => d.classList.toggle("on", k === cur));
  };
  const restart = () => {
    clearInterval(LANDING.promoTimer); LANDING.promoTimer = null;
    if (playing) LANDING.promoTimer = setInterval(() => show(cur + 1), 5000);
    if (playBtn) { playBtn.textContent = playing ? "‖" : "▶"; playBtn.setAttribute("aria-label", playing ? "Pause" : "Play"); }
  };
  if (slides.length) {
    $("#p-prev").onclick = () => { show(cur - 1); restart(); };
    $("#p-next").onclick = () => { show(cur + 1); restart(); };
    playBtn.onclick = () => { playing = !playing; restart(); };
    show(0); restart();
  }
}

/* ---------- onboarding ---------- */
const OB = { step: 0, d: { apps: [], hours: 4, goal: "", mode: "study", puckName: "Desk puck" } };
function obSteps() {

      ok: () => true,
    },
    {
      title: "Pair your puck.",
      why: NFC.supported ? "Tap your phone on the puck. Its NFC tag becomes the only key that unlocks this phone."
        : QR.supported ? "This phone can't read NFC, so scan the QR code on the puck's base. No puck yet? Use a demo puck."
        : "NFC tapping works in Chrome on Android. Here you can try BLOCK with a demo puck.",
      html: `${puckBlock(!!d.paired, d.paired ? "Paired ✓" : (NFC.supported ? "Waiting for your puck…" : "Demo puck"))}

      <p class="note">Each puck has its own ID. The app only accepts the one you pair, so a friend's puck won't unlock your phone.</p>`,
      ok: () => !!OB.d.paired, err: "Pair a puck first, or pick the demo puck.",

}
function planHTML() {
  const d = OB.d;
  return `<div class="card" style="margin-top:22px">
    <h3 style="font-size:19px">Your starting setup</h3>
    <div class="list-item"><b>${MODES[d.mode].name} mode</b><p class="muted" style="font-size:14px">${nApps(d.apps.length)} will shut</p></div>

  </div>`;
}
function renderOB() {
  disposeViewers(); stopPuck();
  const steps = obSteps(), st = steps[OB.step];
  $("#root").innerHTML = `<div class="screen"><div class="ob">
    <div class="row between"><p class="logo" style="font-size:16px">BLOCK</p><span class="muted" style="font-size:13px">${OB.step + 1} of ${steps.length}</span></div>
    <div class="progress"><b style="width:${((OB.step + 1) / steps.length) * 100}%"></b></div>
    <h2>${st.title}</h2>
    <p class="muted">${st.why}</p>
    <div id="ob-body">${st.html}${st.final ? planHTML() : ""}</div>
    <p class="err" id="ob-err" role="alert"></p>
    <div class="ob-nav">${OB.step > 0 ? `<button class="btn btn-ghost" id="ob-back">Back</button>` : ""}<button class="btn btn-lime" id="ob-next">${st.final ? "Start using BLOCK" : "Continue"}</button></div>
  </div></div>`;
  bindOB(st);
}
function bindOB(st) {
  $$("#ob-apps .chip").forEach(b => b.onclick = () => {
    const a = b.dataset.app, i = OB.d.apps.indexOf(a);
    if (i < 0) OB.d.apps.push(a); else OB.d.apps.splice(i, 1);
    b.setAttribute("aria-pressed", i < 0);
  });
  const hrs = $("#hrs");
  if (hrs) hrs.oninput = () => { OB.d.hours = +hrs.value; $("#hrs-v").textContent = hrs.value; };
  $$("#ob-goals .chip").forEach(b => b.onclick = () => { $("#goal").value = b.dataset.goal; });
  $$(".opt[data-mode]").forEach(b => b.onclick = () => {
    OB.d.mode = b.dataset.mode;
    $$(".opt[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  if ($("#puck")) {
    mountPuck("#puck", { onTap: demoTap });
    if (!OB.d.paired) listenForPuck({ pairing: true, onPuck: (id, method) => {
      OB.d.paired = { id: id, method: method }; ripple();
      $("#puckstage").classList.add("on");
      $(".pucklabel").textContent = method === "demo" ? "Demo puck paired \u2713" : "Paired \u2713";
      puckStatus(method === "demo" ? "Using a demo puck. You can pair a real one later in Profile." : "Got it. This puck is now your key.");
      $("#ractions").innerHTML = "";
      $("#ob-err").textContent = "";
    } });
    else puckStatus(OB.d.paired.method === "demo" ? "Using a demo puck." : "Paired.");
  }
  const back = $("#ob-back"); if (back) back.onclick = () => { readOB(); OB.step--; renderOB(); };
  $("#ob-next").onclick = () => {
    readOB();
    if (st.ok && !st.ok()) return ($("#ob-err").textContent = st.err || "Fill this in to continue.");
    if (st.final) return finishOB();
    OB.step++; renderOB();
  };
}
function readOB() {
  const g = $("#goal"); if (g) OB.d.goal = g.value.trim();
  const pn = $("#pname"); if (pn) OB.d.puckName = pn.value.trim() || "Desk puck";
  const h = $("#hrs"); if (h) OB.d.hours = +h.value;
}
function finishOB() {
  const d = OB.d;
  S.profile = { apps: d.apps, hours: d.hours, goal: d.goal };
  S.activeMode = d.mode;
  S.modes[d.mode].apps = d.apps.slice();
  const p = d.paired || { id: null, method: "demo" };
  S.puck = { id: p.id, method: p.method, name: d.puckName, paired: Date.now() };
  addXP(40); save(); go("app/home");
}

  const week = days.reduce((a, d) => a + d.ms, 0);
  const counts = {};
  S.sessions.forEach(s => (s.apps || []).forEach(a => counts[a] = (counts[a] || 0) + 1));
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const byMode = {};
  S.sessions.forEach(s => byMode[s.mode] = (byMode[s.mode] || 0) + (s.end - s.start));

  <section class="card">
    <div class="row between"><b>Last seven days</b><span class="muted" style="font-size:13px">${hhmm(week)} locked</span></div>
    <div class="bars">${days.map(d => {
      const label = d.o === 0 ? "Today" : DAYS[(new Date(Date.now() - d.o * DAY).getDay() + 6) % 7];
      return `<div><i style="height:${Math.max(3, (d.ms / max) * 100)}%" title="${hhmm(d.ms)}"></i><em>${label.slice(0, 3)}</em></div>`;

  <section class="card" style="margin-top:12px"><div class="stats" style="margin-top:0">

    <div><b>${hhmm(S.sessions.reduce((a, s) => a + (s.end - s.start), 0))}</b><span>All time</span></div>

  <section class="card" style="margin-top:12px">
    <b>Where the time went</b>

      : `<p class="muted" style="font-size:14px;margin-top:8px">Lock a session and the split by mode shows up here.</p>`}
